version: 1

security:
  minimum_tls_version: "TLSv1.3"
  allow_classical_only: false
  require_authenticated_peer: true
  fail_closed_on_policy_error: true

allowed_security_modes:
  - QKD_ASSISTED
  - PQC_ONLY
  - HYBRID

state_actions:
  NORMAL:
    action: CONTINUE
    allow_destination_connection: true

  DEGRADED:
    action: SWITCH_SECURITY_MODE
    allow_destination_connection: true
    require_pqc_or_qkd: true

  SUSPICIOUS:
    action: REAUTHENTICATE
    allow_destination_connection: false

  MITM_SUSPECTED:
    action: TERMINATE
    allow_destination_connection: false

  BLOCKED:
    action: BLOCK
    allow_destination_connection: false

qkd:
  maximum_qber: 0.08
  minimum_key_rate_bits_per_second: 1000
  minimum_available_keys: 1
  permit_simulator: true

pqc:
  preferred_kem: "ML-KEM-768"
  preferred_signature: "ML-DSA-65"
  permit_experimental_provider: false

analyzer:
  minimum_tls_version: "TLSv1.2"
  allowed_tls_versions:
    - "TLSv1.2"
    - "TLSv1.3"
  allowed_cipher_suites:
    - "TLS_AES_256_GCM_SHA384"
    - "TLS_AES_128_GCM_SHA256"
    - "TLS_CHACHA20_POLY1305_SHA256"
    - "ECDHE-RSA-AES256-GCM-SHA384"
    - "ECDHE-RSA-AES128-GCM-SHA256"
    - "ECDHE-ECDSA-AES256-GCM-SHA384"
    - "ECDHE-ECDSA-AES128-GCM-SHA256"
  allowed_key_exchange_groups:
    - "x25519"
    - "x448"
    - "secp256r1"
    - "secp384r1"
    - "secp521r1"
    - "X25519MLKEM768"
    - "SecP256r1MLKEM768"
  weak_tls_versions:
    - "SSLv2"
    - "SSLv3"
    - "TLSv1.0"
    - "TLSv1.1"
  pqc_capable_key_exchanges:
    - "X25519MLKEM768"
    - "SecP256r1MLKEM768"
    - "mlkem768"
    - "mlkem1024"
  require_certificate_validation: true
  require_hostname_verification: true
  require_pqc_capable: false
  require_hybrid_security: false

