[build-system]
requires = [
    "setuptools>=75,<81",
    "wheel>=0.45,<1"
]
build-backend = "setuptools.build_meta"

[project]
name = "q-guard"
version = "0.1.0"
description = "Q-Guard Adaptive Quantum-Safe MITM Defense Gateway"
readme = "docs/architecture.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "httpx>=0.28,<1.0",
    "prometheus-client>=0.21,<1.0",
    "cryptography>=44,<47",
    "pyyaml>=6.0,<7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]
